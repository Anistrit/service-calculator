<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Service Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="card">
        <h2>Project Cost Estimator</h2>
        
        <input type="text" id="clientName" placeholder="Client Name">
        <label for="difficulty">Project Difficulty:</label>
        <select id="difficulty">
            <option value="1">Simple (x1.0)</option>
            <option value="1.5">Complex (x1.5)</option>
            <option value="2">Urgent/Pro (x2.0)</option>
        </select>
        <input type="number" id="hours" placeholder="Hours needed" min="0">
        
        <select id="rate">
            <option value="10">Standard ($10/hr)</option>
            <option value="20">Premium ($20/hr)</option>
            <option value="50">Expert ($50/hr)</option>
        </select>

        <div class="checkbox-group">
            <label for="domain">Add Domain Registration (+$15)</label>
            <input type="checkbox" id="domain" onchange="calculate()">
        </div>
        
        <div id="result">Total: $0</div>
        <br>
        <button onclick="generatePDF()">Download PDF estimate</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
